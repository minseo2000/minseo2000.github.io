<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

{%- if page.title -%}
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
{%- else -%}
  <title>{{ site.title | escape }}</title>
{%- endif -%}

<!-- ✅ 기본 SEO 메타 -->
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta name="author" content="{{ site.author | escape }}">
<meta name="robots" content="index, follow">

<!-- ✅ Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- ✅ Open Graph (Facebook, Kakao, LinkedIn 등) -->
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.url }}/assets/og-image.png">

<!-- ✅ Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:image" content="{{ site.url }}/assets/og-image.png">

<!-- ✅ 모바일 최적화 -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="HandheldFriendly" content="true">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- ✅ 아이콘 -->
<link rel="apple-touch-icon-precomposed" sizes="152x152" href="{{site.baseurl}}/assets/gitbook/images/apple-touch-icon-precomposed-152.png">
<link rel="shortcut icon" href="{{site.baseurl}}/{{site.favicon_path}}" type="image/x-icon">

<!-- ✅ 스타일 -->
<link rel="stylesheet" href="{{site.baseurl}}/assets/gitbook/style.css">
<link rel="stylesheet" href="{{site.baseurl}}/assets/gitbook/custom.css">
<link rel="stylesheet" href="{{site.baseurl}}/assets/gitbook/custom-local.css">

<!-- ✅ RSS 구독 (jekyll-feed 플러그인 사용 시 자동 생성됨) -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">

<!-- ✅ 구조화 데이터 (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "url": "{{ site.url }}",
  "name": "{{ site.title }}",
  "description": "{{ site.description }}",
  "publisher": {
    "@type": "Person",
    "name": "{{ site.author }}"
  }
}
</script>
